[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regimearb"
version = "0.1.0"
description = "Regime-aware statistical arbitrage research framework: state-space cointegration, Markov-switching mean reversion, analytic thresholds and backtest-overfitting controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
regimearb = "regimearb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741"]
